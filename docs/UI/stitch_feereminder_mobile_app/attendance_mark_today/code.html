<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Mark Today - FeeReminder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#FAFAF9] text-gray-900 min-h-screen pb-24 antialiased">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20 px-4 py-3.5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-black text-gray-900 leading-tight">Attendance</h1>
        <p class="text-xs font-semibold text-gray-500 mt-0.5">Thursday, September 10, 2026</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold bg-green-50 text-[#15803D] border border-green-200 px-2.5 py-1 rounded-full">
          24/28 Marked
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-3.5 space-y-3.5">
    <!-- Search Bar -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input type="text" placeholder="Search students..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder:text-gray-400 focus:outline-none focus:border-[#3730A3] focus:ring-1 focus:ring-[#3730A3] h-11">
    </div>

    <!-- Quick Batch Stats & Class Filter -->
    <div class="flex items-center justify-between text-xs">
      <div class="flex gap-1.5">
        <button class="bg-[#3730A3] text-white px-3 py-1.5 rounded-lg font-bold">Class 10-A (16)</button>
        <button class="bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-50">Class 9-B (12)</button>
      </div>
      <button class="text-[#3730A3] font-bold hover:underline flex items-center gap-1">
        <i class="fa-solid fa-check-double text-xs"></i> Mark All Present
      </button>
    </div>

    <!-- Student Attendance Rows -->
    <div class="space-y-2.5">
      <!-- Student 1: Present Selected -->
      <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-2">
        <div>
          <h3 class="font-bold text-gray-900 text-sm">Rahul Sharma</h3>
          <p class="text-xs text-gray-400 font-medium">Roll #01 · Class 10-A</p>
        </div>
        <!-- 3 Toggle Buttons -->
        <div class="flex items-center gap-1">
          <button class="h-10 px-3 rounded-lg text-xs font-bold bg-[#15803D] text-white shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-check text-[11px]"></i> Present
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Absent
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Late
          </button>
        </div>
      </div>

      <!-- Student 2: Absent Selected -->
      <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-2">
        <div>
          <h3 class="font-bold text-gray-900 text-sm">Priya Patel</h3>
          <p class="text-xs text-gray-400 font-medium">Roll #02 · Class 10-A</p>
        </div>
        <div class="flex items-center gap-1">
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Present
          </button>
          <button class="h-10 px-3 rounded-lg text-xs font-bold bg-[#DC2626] text-white shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-xmark text-[11px]"></i> Absent
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Late
          </button>
        </div>
      </div>

      <!-- Student 3: Late Selected -->
      <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-2">
        <div>
          <h3 class="font-bold text-gray-900 text-sm">Amit Verma</h3>
          <p class="text-xs text-gray-400 font-medium">Roll #03 · Class 10-A</p>
        </div>
        <div class="flex items-center gap-1">
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Present
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Absent
          </button>
          <button class="h-10 px-3 rounded-lg text-xs font-bold bg-[#D97706] text-white shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-clock text-[11px]"></i> Late
          </button>
        </div>
      </div>

      <!-- Student 4: Present Selected -->
      <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-2">
        <div>
          <h3 class="font-bold text-gray-900 text-sm">Sneha Kulkarni</h3>
          <p class="text-xs text-gray-400 font-medium">Roll #04 · Class 10-A</p>
        </div>
        <div class="flex items-center gap-1">
          <button class="h-10 px-3 rounded-lg text-xs font-bold bg-[#15803D] text-white shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-check text-[11px]"></i> Present
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Absent
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Late
          </button>
        </div>
      </div>

      <!-- Student 5: Present Selected -->
      <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-2">
        <div>
          <h3 class="font-bold text-gray-900 text-sm">Vikas Kumar</h3>
          <p class="text-xs text-gray-400 font-medium">Roll #05 · Class 10-A</p>
        </div>
        <div class="flex items-center gap-1">
          <button class="h-10 px-3 rounded-lg text-xs font-bold bg-[#15803D] text-white shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-check text-[11px]"></i> Present
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Absent
          </button>
          <button class="h-10 px-2.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
            Late
          </button>
        </div>
      </div>
    </div>

    <!-- Save Bar -->
    <div class="pt-2">
      <button class="w-full bg-[#3730A3] hover:bg-indigo-900 text-white font-bold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2 h-12 shadow-sm transition">
        <i class="fa-solid fa-floppy-disk"></i> Save Today's Attendance
      </button>
    </div>
  </main>

  <!-- Bottom Navigation with Attendance active -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-3 py-2 z-30">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
      <a href="#" class="flex flex-col items-center justify-center py-1 text-gray-500 hover:text-gray-900 font-medium">
        <i class="fa-solid fa-table-cells-large text-base mb-1"></i>
        <span class="text-[11px]">Dashboard</span>
      </a>
      <a href="#" class="flex flex-col items-center justify-center py-1 text-[#3730A3] font-bold">
        <i class="fa-solid fa-calendar-check text-base mb-1"></i>
        <span class="text-[11px]">Attendance</span>
      </a>
      <a href="#" class="flex flex-col items-center justify-center py-1 text-gray-500 hover:text-gray-900 font-medium">
        <i class="fa-solid fa-user-group text-base mb-1"></i>
        <span class="text-[11px]">Students</span>
      </a>
      <a href="#" class="flex flex-col items-center justify-center py-1 text-gray-500 hover:text-gray-900 font-medium">
        <i class="fa-solid fa-chart-pie text-base mb-1"></i>
        <span class="text-[11px]">Reports</span>
      </a>
    </div>
  </nav>
</body>
</html>
