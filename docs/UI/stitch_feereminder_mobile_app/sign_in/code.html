<h1 class="font-headline-lg text-headline-lg text-on-surface">Sign In</h1>

<form class="flex flex-col gap-stack-gap-lg" novalidate="" onsubmit="event.preventDefault();">

</div>

</div>
</div>

<label class="flex items-center gap-stack-gap-sm cursor-pointer select-none py-1">

<div class="relative flex items-center justify-center">

<div class="flex flex-col items-center text-center gap-1">
<p class="font-body-md text-body-md text-on-surface-variant">

        Create one

</div>
<!-- Trust Stamp for Outdoor Confidence -->
<div class="flex items-center justify-center gap-2 pt-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-badge text-label-badge">256-bit encrypted tuition ledger</span>
</div>
</div>
</div>
<script>
  (function() {
    var toggleBtn = document.getElementById('toggle-password');
    var passwordInput = document.getElementById('signin-password');
    var eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        var isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
