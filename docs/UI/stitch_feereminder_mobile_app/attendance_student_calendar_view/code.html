<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Student Calendar View - FeeReminder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .day-present { background-color: #15803D; color: #ffffff; }
    .day-absent { background-color: #DC2626; color: #ffffff; }
    .day-late { background-color: #D97706; color: #ffffff; }
    .day-future { background-color: #F3F4F6; color: #9CA3AF; }
  </style>
</head>
<body class="bg-[#FAFAF9] text-gray-900 min-h-screen pb-12 antialiased">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button class="w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <div>
          <h1 class="text-base font-bold text-gray-900 leading-tight">Rahul Sharma — Attendance</h1>
          <p class="text-xs font-semibold text-gray-500">Roll #01 · Class 10-A</p>
        </div>
      </div>
      <button class="text-xs font-bold text-[#3730A3] border border-[#3730A3]/20 bg-indigo-50 px-2.5 py-1.5 rounded-lg">
        Export
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- Stat Hero Banner -->
    <div class="bg-white p-4 rounded-xl border border-gray-200 flex items-center justify-between">
      <div>
        <span class="text-xs font-bold text-gray-500 uppercase tracking-wide">Monthly Metric</span>
        <div class="text-xl font-black text-[#15803D] mt-0.5">92% present this month</div>
        <p class="text-xs text-gray-500 mt-1">22 Present · 1 Absent · 1 Late</p>
      </div>
      <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-[#15803D] text-lg font-black">
        <i class="fa-solid fa-award"></i>
      </div>
    </div>

    <!-- Calendar Container -->
    <div class="bg-white p-4 rounded-xl border border-gray-200 space-y-3.5 shadow-sm">
      <!-- Month Navigation Arrows -->
      <div class="flex items-center justify-between">
        <button class="w-9 h-9 rounded-lg border border-gray-200 hover:bg-gray-50 flex items-center justify-center text-gray-700 font-bold text-sm">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="text-sm font-bold text-gray-900">September 2026</span>
        <button class="w-9 h-9 rounded-lg border border-gray-200 hover:bg-gray-50 flex items-center justify-center text-gray-700 font-bold text-sm">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Weekday Labels -->
      <div class="grid grid-cols-7 text-center text-[11px] font-bold text-gray-400 uppercase tracking-wider pb-1">
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
        <span>Sun</span>
      </div>

      <!-- Calendar Days Grid (Month starting Tuesday Sep 1) -->
      <div class="grid grid-cols-7 gap-1.5 text-center">
        <!-- Aug 31 filler -->
        <div class="h-10 rounded-lg flex items-center justify-center text-xs text-gray-300">31</div>

        <!-- Sep 1 to 10 (Past/Marked) -->
        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center shadow-xs">1</button>
        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center shadow-xs">2</button>
        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center shadow-xs">3</button>
        <button class="h-10 rounded-lg day-late font-bold text-xs flex flex-col items-center justify-center shadow-xs">4</button>
        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center shadow-xs">5</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">6</button>

        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center shadow-xs">7</button>
        <button class="h-10 rounded-lg day-absent font-bold text-xs flex flex-col items-center justify-center shadow-xs">8</button>
        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center shadow-xs">9</button>
        <!-- Today Sep 10 - Tapped/Active Selected Day with Ring -->
        <button class="h-10 rounded-lg day-present font-bold text-xs flex flex-col items-center justify-center ring-2 ring-[#3730A3] ring-offset-2">10</button>
        
        <!-- Future Days Sep 11 to 30 -->
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">11</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">12</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">13</button>

        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">14</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">15</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">16</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">17</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">18</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">19</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">20</button>

        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">21</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">22</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">23</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">24</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">25</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">26</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">27</button>

        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">28</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">29</button>
        <button class="h-10 rounded-lg day-future font-semibold text-xs flex flex-col items-center justify-center">30</button>
        <div class="h-10 rounded-lg flex items-center justify-center text-xs text-gray-300">1</div>
        <div class="h-10 rounded-lg flex items-center justify-center text-xs text-gray-300">2</div>
        <div class="h-10 rounded-lg flex items-center justify-center text-xs text-gray-300">3</div>
        <div class="h-10 rounded-lg flex items-center justify-center text-xs text-gray-300">4</div>
      </div>

      <!-- Color Legend -->
      <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs font-semibold">
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-[#15803D]"></span> Present</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-[#DC2626]"></span> Absent</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-[#D97706]"></span> Late</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-gray-200"></span> Future</div>
      </div>
    </div>

    <!-- Inline Selector (Tapped on Sep 10) -->
    <div class="bg-indigo-50/70 border border-[#3730A3]/20 rounded-xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-gray-900 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-day text-[#3730A3]"></i> Edit Status for Thursday, Sep 10
        </span>
        <span class="text-[11px] font-bold text-[#15803D]">Currently: Present</span>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button class="h-10 bg-[#15803D] text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1">
          <i class="fa-solid fa-check"></i> Present
        </button>
        <button class="h-10 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold rounded-lg text-xs">
          Absent
        </button>
        <button class="h-10 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold rounded-lg text-xs">
          Late
        </button>
      </div>
    </div>
  </main>
</body>
</html>
